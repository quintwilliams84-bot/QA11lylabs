<svg width="1440" height="420" viewBox="0 0 1440 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QA11Y Labs primary logo</title>
  <desc id="desc">A modern QA11Y Labs logo with a cyan shield check mark, terminal scan lines, cyan QA11Y text, gold Labs text, and the tagline Architecting a more inclusive digital world.</desc>
  <defs>
    <linearGradient id="shieldFill" x1="110" y1="52" x2="300" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#112827"/>
      <stop offset="0.52" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanStroke" x1="106" y1="48" x2="314" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66FCF1"/>
      <stop offset="1" stop-color="#45A29E"/>
    </linearGradient>
    <linearGradient id="wordmarkCyan" x1="382" y1="101" x2="856" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFFFFB"/>
      <stop offset="0.33" stop-color="#66FCF1"/>
      <stop offset="1" stop-color="#45A29E"/>
    </linearGradient>
    <linearGradient id="labsGold" x1="842" y1="98" x2="1104" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="0.48" stop-color="#F2A900"/>
      <stop offset="1" stop-color="#C47900"/>
    </linearGradient>
    <filter id="softCyanGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.4 0 0 0 0 0.988 0 0 0 0 0.945 0 0 0 0.42 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGoldGlow" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.949 0 0 0 0 0.663 0 0 0 0 0 0 0 0 0.32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanLines" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 2H10" stroke="#66FCF1" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="420" rx="44" fill="#0B0C10"/>
  <g opacity="0.58">
    <path d="M86 57H334" stroke="#1E2330" stroke-width="2"/>
    <path d="M86 352H334" stroke="#1E2330" stroke-width="2"/>
    <path d="M1186 116H1354" stroke="#1E2330" stroke-width="2"/>
    <path d="M1186 302H1354" stroke="#1E2330" stroke-width="2"/>
    <circle cx="1210" cy="116" r="4" fill="#66FCF1" fill-opacity="0.52"/>
    <circle cx="1230" cy="116" r="4" fill="#F2A900" fill-opacity="0.52"/>
    <circle cx="1250" cy="116" r="4" fill="#45A29E" fill-opacity="0.52"/>
  </g>
  <g filter="url(#softCyanGlow)">
    <path d="M210 47L89 98V190C89 257.5 139.5 306.8 210 323C280.5 306.8 331 257.5 331 190V98L210 47Z" fill="url(#shieldFill)" stroke="url(#cyanStroke)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M210 73L115 113V187C115 241 153.7 278.1 210 292C266.3 278.1 305 241 305 187V113L210 73Z" fill="url(#scanLines)" opacity="0.85"/>
    <path d="M155 191L193 229L267 151" stroke="#66FCF1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M151 137H188" stroke="#F2A900" stroke-width="6" stroke-linecap="round"/>
    <path d="M151 159H221" stroke="#45A29E" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M151 248H178" stroke="#F2A900" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M237 248H271" stroke="#45A29E" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g>
    <text x="382" y="196" fill="url(#wordmarkCyan)" filter="url(#softCyanGlow)" font-family="Arial, Noto Sans, DejaVu Sans, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" direction="ltr" unicode-bidi="bidi-override" text-anchor="start">QA11Y</text>
    <text x="776" y="196" fill="url(#labsGold)" filter="url(#subtleGoldGlow)" font-family="Arial, Noto Sans, DejaVu Sans, sans-serif" font-size="118" font-weight="800" letter-spacing="-4" direction="ltr" unicode-bidi="bidi-override" text-anchor="start">Labs</text>
    <path d="M385 228H1078" stroke="#1E2330" stroke-width="3" stroke-linecap="round"/>
    <path d="M385 228H699" stroke="#66FCF1" stroke-width="3" stroke-linecap="round"/>
    <path d="M1022 228H1078" stroke="#F2A900" stroke-width="3" stroke-linecap="round"/>
    <text x="386" y="286" fill="#C5C6C7" font-family="Arial, Noto Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="500" letter-spacing="2" direction="ltr" unicode-bidi="bidi-override" text-anchor="start">Architecting a more inclusive digital world</text>
    <g transform="translate(386 319)" opacity="0.88">
      <rect x="0" y="0" width="16" height="16" rx="2" fill="#66FCF1"/>
      <rect x="32" y="0" width="16" height="16" rx="2" fill="#45A29E"/>
      <rect x="64" y="0" width="16" height="16" rx="2" fill="#F2A900"/>
      <path d="M118 8H472" stroke="#1E2330" stroke-width="3" stroke-linecap="round"/>
      <path d="M118 8H292" stroke="#45A29E" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
